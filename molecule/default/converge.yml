---
- name: Converge
  hosts: all
  gather_facts: true

  vars:
    nodejs_install_npm_user: root
    nodejs_version: "22.x"

  pre_tasks:
    - name: Update apt cache.
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600

  roles:
    - role: geerlingguy.nodejs
    - role: ansible-role-uptime-kuma
